<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <!-- card background -->
  <rect x="1" y="1" width="918" height="428" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <!-- divider -->
  <line x1="460" y1="45" x2="460" y2="355" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- ===== left: three specialists ===== -->
  <text x="240" y="64" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">Three specialists</text>
  <text x="240" y="88" font-size="12.5" font-style="italic" fill="#94a3b8" text-anchor="middle">each deep in one layer, and the work waits for whoever is free</text>

  <g fill="#f8fafc" stroke="#94a3b8" stroke-width="2">
    <rect x="90" y="140" width="80" height="170" rx="6"/>
    <rect x="200" y="140" width="80" height="170" rx="6"/>
    <rect x="310" y="140" width="80" height="170" rx="6"/>
  </g>

  <line x1="70" y1="310" x2="410" y2="310" stroke="#cbd5e1" stroke-width="2"/>
  <g font-size="13" fill="#64748b" text-anchor="middle">
    <text x="130" y="334">mobile</text>
    <text x="240" y="334">frontend</text>
    <text x="350" y="334">backend</text>
  </g>

  <!-- ===== right: one expert-generalist ===== -->
  <text x="680" y="64" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">One expert-generalist</text>
  <text x="680" y="88" font-size="12.5" font-style="italic" fill="#94a3b8" text-anchor="middle">deep in one or two layers, broad across all of them</text>

  <!-- broad bar -->
  <rect x="520" y="214" width="320" height="60" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="680" y="249" font-size="12.5" fill="#3730a3" text-anchor="middle">broad across every layer</text>

  <!-- depth prongs -->
  <g fill="#eef2ff" stroke="#4f46e5" stroke-width="2">
    <rect x="545" y="154" width="80" height="64" rx="6"/>
    <rect x="745" y="104" width="80" height="114" rx="6"/>
  </g>

  <!-- model floor -->
  <rect x="520" y="274" width="320" height="36" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="680" y="297" font-size="11.5" fill="#92400e" text-anchor="middle">what the model carries: syntax, boilerplate</text>

  <g font-size="13" fill="#64748b" text-anchor="middle">
    <text x="585" y="334">mobile</text>
    <text x="680" y="334">frontend</text>
    <text x="785" y="334">backend</text>
  </g>

  <!-- caption -->
  <text x="460" y="395" font-size="13.5" fill="#64748b" text-anchor="middle">The model raises the floor under every layer.  Depth goes where the work needs it.</text>
</svg>
