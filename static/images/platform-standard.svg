<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowUp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowIncident" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- card background -->
  <rect x="1" y="1" width="918" height="438" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <!-- product teams -->
  <g>
    <rect x="140" y="120" width="180" height="70" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="230" y="160" font-size="14.5" font-weight="700" fill="#115e59" text-anchor="middle">product team</text>
    <rect x="370" y="120" width="180" height="70" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="460" y="160" font-size="14.5" font-weight="700" fill="#115e59" text-anchor="middle">product team</text>
    <rect x="600" y="120" width="180" height="70" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="690" y="160" font-size="14.5" font-weight="700" fill="#115e59" text-anchor="middle">product team</text>
  </g>

  <!-- inherit arrows -->
  <g stroke="#475569" stroke-width="2.5">
    <line x1="230" y1="228" x2="230" y2="196" marker-end="url(#arrowUp)"/>
    <line x1="460" y1="228" x2="460" y2="196" marker-end="url(#arrowUp)"/>
    <line x1="690" y1="228" x2="690" y2="196" marker-end="url(#arrowUp)"/>
  </g>

  <!-- platform slab -->
  <rect x="80" y="230" width="760" height="115" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="460" y="258" font-size="15" font-weight="700" fill="#3730a3" text-anchor="middle">platform team</text>
  <g font-size="12.5" fill="#334155">
    <rect x="150" y="272" width="130" height="32" rx="16" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="215" y="293" text-anchor="middle">design system</text>
    <rect x="300" y="272" width="130" height="32" rx="16" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="365" y="293" text-anchor="middle">auth + identity</text>
    <rect x="450" y="272" width="125" height="32" rx="16" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="512" y="293" text-anchor="middle">observability</text>
    <rect x="595" y="272" width="200" height="32" rx="16" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="695" y="293" text-anchor="middle">guardrails + golden paths</text>
  </g>
  <text x="460" y="330" font-size="11.5" font-style="italic" fill="#6366f1" text-anchor="middle">the standard every team stands on, encoded once</text>

  <!-- incident -->
  <text x="800" y="58" font-size="12.5" font-weight="600" fill="#b45309" text-anchor="middle">an incident lands once</text>
  <path d="M 835 75 C 840 130 830 180 806 224" fill="none" stroke="#b45309" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrowIncident)"/>

  <!-- caption -->
  <text x="460" y="410" font-size="13.5" fill="#64748b" text-anchor="middle">An incident fixed in the platform becomes impossible for every team at once.</text>
</svg>
