<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 456" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- card background -->
  <rect x="1" y="1" width="918" height="454" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ===== row 1: the handoff pipeline ===== -->
  <text x="40" y="62" font-size="16" font-weight="700" fill="#475569">The handoff pipeline</text>

  <!-- SME -->
  <rect x="40" y="85" width="160" height="62" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="120" y="112" font-size="15" font-weight="700" fill="#3730a3" text-anchor="middle">SME</text>
  <text x="120" y="132" font-size="11.5" font-style="italic" fill="#6366f1" text-anchor="middle">knows what good looks like</text>

  <path d="M 200 116 L 248 116" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow3)"/>

  <!-- PM -->
  <rect x="250" y="85" width="110" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="305" y="112" font-size="15" font-weight="700" fill="#64748b" text-anchor="middle">PM</text>
  <text x="305" y="132" font-size="11.5" font-style="italic" fill="#94a3b8" text-anchor="middle">writes it down</text>

  <path d="M 360 116 L 408 116" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow3)"/>

  <!-- engineer -->
  <rect x="410" y="85" width="130" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="475" y="112" font-size="15" font-weight="700" fill="#64748b" text-anchor="middle">engineer</text>
  <text x="475" y="132" font-size="11.5" font-style="italic" fill="#94a3b8" text-anchor="middle">builds from the doc</text>

  <path d="M 540 116 L 588 116" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow3)"/>

  <!-- system -->
  <rect x="590" y="85" width="150" height="62" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="665" y="121" font-size="15" font-weight="700" fill="#115e59" text-anchor="middle">system</text>

  <text x="755" y="110" font-size="12.5" font-style="italic" fill="#64748b">an approximation</text>
  <text x="755" y="127" font-size="12.5" font-style="italic" fill="#64748b">of an approximation</text>

  <text x="40" y="180" font-size="13" font-style="italic" fill="#94a3b8">every handoff drops fidelity, and everyone accepted it because building was expensive</text>

  <!-- divider -->
  <line x1="40" y1="208" x2="880" y2="208" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- ===== row 2: the SME-builder ===== -->
  <text x="40" y="248" font-size="16" font-weight="700" fill="#475569">The SME-builder</text>

  <!-- SME-builder -->
  <rect x="40" y="268" width="190" height="88" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="135" y="298" font-size="15" font-weight="700" fill="#3730a3" text-anchor="middle">SME-builder</text>
  <text x="135" y="318" font-size="11.5" font-style="italic" fill="#6366f1" text-anchor="middle">one person, or a pair</text>
  <text x="135" y="334" font-size="11.5" font-style="italic" fill="#6366f1" text-anchor="middle">acting as one</text>

  <path d="M 230 312 L 308 312" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow3)"/>
  <text x="270" y="300" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">encodes</text>

  <!-- factory -->
  <rect x="310" y="252" width="330" height="120" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
  <text x="475" y="280" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">the factory</text>
  <g font-size="12.5" fill="#334155">
    <rect x="335" y="294" width="76" height="30" rx="15" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/>
    <text x="373" y="314" text-anchor="middle">evals</text>
    <rect x="423" y="294" width="104" height="30" rx="15" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/>
    <text x="475" y="314" text-anchor="middle">guardrails</text>
    <rect x="539" y="294" width="86" height="30" rx="15" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/>
    <text x="582" y="314" text-anchor="middle">context</text>
  </g>
  <text x="475" y="352" font-size="11.5" font-style="italic" fill="#b45309" text-anchor="middle">the standard every team inherits</text>

  <path d="M 640 312 L 718 312" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow3)"/>
  <text x="680" y="300" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">generates</text>

  <!-- system -->
  <rect x="720" y="281" width="160" height="62" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="800" y="308" font-size="15" font-weight="700" fill="#115e59" text-anchor="middle">system</text>
  <text x="800" y="328" font-size="11.5" font-style="italic" fill="#0f766e" text-anchor="middle">converges on the pins</text>

  <!-- caption -->
  <text x="460" y="416" font-size="13.5" fill="#64748b" text-anchor="middle">The SME-builder's output is not features.  It's judgment, encoded where every team inherits it.</text>
</svg>
